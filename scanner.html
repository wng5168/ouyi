<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 仓储扫码终端</title>
    <link rel="icon" href="data:,">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            --bg: var(--tg-theme-bg-color, #f3f7fa);
            --card: var(--tg-theme-secondary-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #173047);
            --hint: var(--tg-theme-hint-color, #718190);
            --accent: var(--tg-theme-button-color, #1687d9);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --ok: #16884a;
            --warning: #bc6b00;
            --danger: #b83232;
            --border: rgba(90, 110, 125, 0.18);
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button { font: inherit; }
        .app {
            width: min(760px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: 12px 12px 24px;
        }
        h1 { margin: 2px 0 10px; font-size: 24px; }
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .tab-btn, .action-btn {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 10px;
            background: var(--card);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
        }
        .tab-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 13px;
            margin-bottom: 10px;
            box-shadow: 0 3px 14px rgba(20, 45, 65, 0.06);
        }
        .status-row { display: flex; align-items: center; gap: 9px; }
        .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--warning); flex: none; }
        .dot.online { background: var(--ok); }
        .dot.error { background: var(--danger); }
        #connection-text { font-weight: 700; }
        #session-text, #last-result { margin-top: 7px; color: var(--hint); line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
        #last-result.strong { color: var(--text); }
        #last-result { border-top: 1px solid var(--border); padding-top: 8px; font-size: 14px; }
        .attention-panel { margin-top: 9px; }
        .attention-panel[hidden] { display: none; }
        .attention-heading { font-weight: 800; color: var(--danger); margin-bottom: 7px; }
        .attention-list { display: grid; gap: 7px; max-height: 190px; overflow-y: auto; }
        .attention-item {
            border-left: 4px solid var(--warning);
            border-radius: 9px;
            padding: 8px 10px;
            background: rgba(188, 107, 0, 0.08);
        }
        .attention-item.danger { border-left-color: var(--danger); background: rgba(184, 50, 50, 0.08); }
        .attention-item-title { font-weight: 800; overflow-wrap: anywhere; }
        .attention-item-meta { color: var(--hint); font-size: 13px; margin-top: 3px; }
        .hid-card { border: 2px solid rgba(22, 136, 74, 0.35); }
        .hid-title { color: var(--ok); font-size: 18px; font-weight: 800; }
        .hid-help { color: var(--hint); margin-top: 5px; line-height: 1.35; font-size: 13px; }
        #hid-preview { min-height: 24px; margin-top: 10px; font-family: Consolas, monospace; color: var(--text); overflow-wrap: anywhere; }
        #hid-capture {
            display: block;
            width: 100%;
            min-height: 48px;
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            background: var(--bg);
            color: var(--text);
            font-family: Consolas, monospace;
            font-size: 18px;
            text-transform: uppercase;
        }
        #hid-capture:focus {
            border-color: var(--ok);
            box-shadow: 0 0 0 3px rgba(22, 136, 74, 0.14);
            outline: none;
        }
        .quantity-tools[hidden] { display: none; }
        .quantity-title { font-size: 18px; font-weight: 800; }
        #quantity-target { margin-top: 7px; color: var(--hint); overflow-wrap: anywhere; }
        .quantity-entry { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
        #quantity-input {
            min-width: 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            background: var(--bg);
            color: var(--text);
            font-size: 18px;
        }
        #quantity-input:focus { border-color: var(--accent); outline: none; }
        .quantity-help { margin-top: 8px; color: var(--hint); font-size: 14px; }
        #camera-panel { display: none; padding: 0; overflow: hidden; }
        #camera-panel.active { display: block; }
        #reader { width: 100%; min-height: 300px; background: #000; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .action-btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
        .action-btn.danger { color: var(--danger); }
        .queue { margin-top: 10px; font-size: 14px; color: var(--hint); }
        .queue.has-items { color: var(--warning); font-weight: 700; }
        .pending-card { border: 2px solid rgba(188, 107, 0, 0.34); }
        .pending-card[hidden] { display: none; }
        .pending-title { color: var(--warning); font-size: 18px; font-weight: 800; }
        #pending-detail { margin-top: 8px; color: var(--text); line-height: 1.4; }
        .pending-item-main { font-size: 19px; font-weight: 800; overflow-wrap: anywhere; }
        .pending-description { margin-top: 4px; font-size: 14px; }
        .pending-reason { margin-top: 7px; padding: 7px 9px; border-radius: 8px; background: rgba(188, 107, 0, 0.09); font-size: 13px; color: var(--warning); }
        .field-label { display: block; margin-top: 9px; color: var(--hint); font-size: 13px; font-weight: 700; }
        #pending-select, #pending-allocations {
            width: 100%;
            margin-top: 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
        }
        #pending-allocations { min-height: 82px; resize: vertical; font-family: Consolas, monospace; }
        .pending-entry { display: grid; grid-template-columns: minmax(0, 2fr) minmax(82px, 1fr); gap: 8px; }
        #pending-barcode, #pending-quantity {
            width: 100%;
            min-width: 0;
            margin-top: 5px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
        }
        #pending-barcode:focus, #pending-quantity:focus { border-color: var(--warning); outline: none; }
        #pending-add-btn { width: 100%; margin-top: 8px; }
        #pending-allocation-list { display: grid; gap: 5px; margin-top: 8px; }
        .allocation-item { display: flex; justify-content: space-between; gap: 8px; border-radius: 8px; padding: 7px 9px; background: var(--bg); font-family: Consolas, monospace; font-size: 14px; }
        .allocation-remove { border: 0; background: transparent; color: var(--danger); font-weight: 800; cursor: pointer; }
        .pending-advanced { margin-top: 8px; color: var(--hint); font-size: 13px; }
        .pending-advanced summary { cursor: pointer; }
        #pending-confirm-btn { width: 100%; margin-top: 9px; background: var(--warning); color: #fff; border-color: var(--warning); }
        .pending-help { margin-top: 8px; color: var(--hint); font-size: 14px; line-height: 1.45; }
        .move-step { color: var(--accent); font-weight: 800; }
        @media (max-width: 420px) {
            h1 { font-size: 22px; }
            .app { padding-left: 10px; padding-right: 10px; }
            .actions { grid-template-columns: 1fr; }
            .quantity-entry { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="app">
        <h1>出库扫码工作台</h1>

        <div class="tabs">
            <button id="tab-auto" class="tab-btn active" type="button">🔎 智能扫码</button>
            <button id="tab-move" class="tab-btn" type="button">📍 显式移库</button>
        </div>

        <section class="card status-card">
            <div class="status-row">
                <span id="connection-dot" class="dot"></span>
                <span id="connection-text">正在建立安全会话…</span>
            </div>
            <div id="session-text">正在读取当前业务状态</div>
            <div id="queue-text" class="queue">待发送：0 条</div>
            <div id="attention-panel" class="attention-panel" hidden>
                <div id="attention-heading" class="attention-heading">当前需要处理</div>
                <div id="attention-list" class="attention-list"></div>
            </div>
            <div id="last-result">尚未扫码</div>
        </section>

        <section id="pending-panel" class="card pending-card" hidden>
            <div id="pending-title" class="pending-title">⚠️ 先处理待确认商品</div>
            <div id="pending-detail"></div>
            <label class="field-label" for="pending-select">待确认订单行</label>
            <select id="pending-select" aria-label="选择待确认商品"></select>
            <div class="pending-entry">
                <label class="field-label" for="pending-barcode">正确商品条码
                    <input id="pending-barcode" type="text" inputmode="text" autocomplete="off"
                           autocorrect="off" spellcheck="false" placeholder="点击这里后扫描条码">
                </label>
                <label class="field-label" for="pending-quantity">分配件数
                    <input id="pending-quantity" type="number" inputmode="numeric" min="1" step="1">
                </label>
            </div>
            <button id="pending-add-btn" class="action-btn" type="button">＋ 加入分配清单</button>
            <div id="pending-allocation-list"></div>
            <details class="pending-advanced">
                <summary>高级：一行分配多个条码</summary>
                <textarea id="pending-allocations" inputmode="text" autocomplete="off"
                          autocorrect="off" spellcheck="false"
                          placeholder="商品条码=数量；多款请换行"></textarea>
            </details>
            <button id="pending-confirm-btn" class="action-btn" type="button">确认分配并继续扫码</button>
            <div class="pending-help">分配总数必须等于原订单数量；提交前不会改变扫码或订单数据。</div>
        </section>

        <section class="card hid-card">
            <div class="hid-title">🔫 蓝牙扫码枪已就绪（HID）</div>
            <div id="hid-help" class="hid-help">保持本页面开启，直接连续扫码；扫码枪请配置 Enter/CR 结束符。</div>
            <input id="hid-capture" type="text" inputmode="none" enterkeyhint="send"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   virtualkeyboardpolicy="manual" autofocus placeholder="等待扫码…"
                   aria-label="蓝牙扫码枪输入">
            <div id="hid-preview">输入框已就绪</div>
            <div id="quantity-panel" class="quantity-tools" hidden>
                <div class="quantity-title">修改刚扫商品数量</div>
                <div id="quantity-target">请先扫描商品条码</div>
                <div class="quantity-entry">
                    <input id="quantity-input" type="text" inputmode="text" autocomplete="off"
                           autocorrect="off" spellcheck="false" placeholder="50包 / 11件"
                           aria-label="商品实际数量">
                    <button id="quantity-confirm-btn" class="action-btn" type="button">确认数量</button>
                </div>
                <div class="quantity-help">整包输入“50包”；散装少件输入“11件”。</div>
            </div>
        </section>

        <section id="camera-panel" class="card">
            <div id="reader"></div>
        </section>

        <div class="actions">
            <button id="camera-btn" class="action-btn primary" type="button">📷 启用摄像头备用</button>
            <button id="retry-btn" class="action-btn" type="button">↻ 重试待发送</button>
            <button id="close-btn" class="action-btn danger" type="button">关闭扫码终端</button>
        </div>
    </main>

    <script>
        "use strict";

        const tg = window.Telegram && window.Telegram.WebApp
            ? window.Telegram.WebApp
            : { initData: "", ready() {}, expand() {}, close() {}, sendData() {} };
        tg.ready();
        tg.expand();

        const SESSION_PATH = "/api/v1/scanner/web/session";
        const SESSION_STATE_PATH = "/api/v1/scanner/session";
        const DEFAULT_DISPATCH_PATH = "/api/v1/scanner/dispatch";
        const QUANTITY_PATH = "/api/v1/scanner/quantity";
        const SESSION_ACTION_PATH = "/api/v1/scanner/session/action";
        const DB_NAME = "ai-warehouse-scanner";
        const DB_VERSION = 1;
        const STORE_PENDING = "pending-events";
        const CLIENT_ID_KEY = "ai_scanner_client_id_v1";
        const SEQUENCE_KEY = "ai_scanner_local_sequence_v1";
        const API_TIMEOUT_MS = 10000;
        const HID_FRAME_TIMEOUT_MS = 1800;
        const CAMERA_DEBOUNCE_MS = 1400;
        const CAMERA_DECODER_URL = "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js";
        const CAMERA_DECODER_TIMEOUT_MS = 12000;

        const elements = {
            connectionDot: document.getElementById("connection-dot"),
            connectionText: document.getElementById("connection-text"),
            sessionText: document.getElementById("session-text"),
            queueText: document.getElementById("queue-text"),
            hidCapture: document.getElementById("hid-capture"),
            hidPreview: document.getElementById("hid-preview"),
            hidHelp: document.getElementById("hid-help"),
            cameraPanel: document.getElementById("camera-panel"),
            cameraButton: document.getElementById("camera-btn"),
            retryButton: document.getElementById("retry-btn"),
            closeButton: document.getElementById("close-btn"),
            lastResult: document.getElementById("last-result"),
            tabAuto: document.getElementById("tab-auto"),
            tabMove: document.getElementById("tab-move"),
            quantityPanel: document.getElementById("quantity-panel"),
            quantityTarget: document.getElementById("quantity-target"),
            quantityInput: document.getElementById("quantity-input"),
            quantityConfirmButton: document.getElementById("quantity-confirm-btn"),
            pendingPanel: document.getElementById("pending-panel"),
            pendingDetail: document.getElementById("pending-detail"),
            pendingTitle: document.getElementById("pending-title"),
            pendingSelect: document.getElementById("pending-select"),
            pendingBarcode: document.getElementById("pending-barcode"),
            pendingQuantity: document.getElementById("pending-quantity"),
            pendingAddButton: document.getElementById("pending-add-btn"),
            pendingAllocations: document.getElementById("pending-allocations"),
            pendingAllocationList: document.getElementById("pending-allocation-list"),
            pendingConfirmButton: document.getElementById("pending-confirm-btn"),
            attentionPanel: document.getElementById("attention-panel"),
            attentionHeading: document.getElementById("attention-heading"),
            attentionList: document.getElementById("attention-list"),
        };

        function resolveEntryMode() {
            const requested = String(new URLSearchParams(window.location.search).get("mode") || "")
                .trim()
                .toLowerCase();
            return requested === "terminal" ? "terminal" : "legacy";
        }

        const entryMode = resolveEntryMode();
        if (
            entryMode === "terminal"
            && typeof tg.enableClosingConfirmation === "function"
        ) {
            tg.enableClosingConfirmation();
        }

        const state = {
            mode: "AUTO",
            moveStep: 1,
            moveProduct: "",
            db: null,
            clientId: loadOrCreateClientId(),
            accessToken: "",
            deviceId: "",
            operatorId: 0,
            dispatchPath: DEFAULT_DISPATCH_PATH,
            tokenExpiresAt: 0,
            sessionPromise: null,
            processingQueue: false,
            camera: null,
            cameraActive: false,
            cameraBusy: false,
            lastCameraValue: "",
            lastCameraAt: 0,
            hidTimer: null,
            hidPendingTerminator: false,
            composing: false,
            legacyMode: entryMode !== "terminal",
            cameraDecoderPromise: null,
            lastProduct: null,
            quantitySubmitting: false,
            pendingSubmitting: false,
            pendingEditorKey: "",
            activeSession: null,
            attentionItems: [],
            attentionRefreshPromise: null,
        };

        function resolveApiBase() {
            const configured = new URLSearchParams(window.location.search).get("api");
            const candidate = String(configured || window.location.origin || "").trim();
            try {
                const parsed = new URL(candidate);
                if (parsed.protocol !== "https:") throw new Error("扫码服务必须使用 HTTPS");
                return parsed.href.replace(/\/$/, "");
            } catch (_) {
                return "";
            }
        }

        const apiBase = resolveApiBase();

        function randomAscii(size = 16) {
            const bytes = new Uint8Array(size);
            if (window.crypto && window.crypto.getRandomValues) {
                window.crypto.getRandomValues(bytes);
            } else {
                for (let index = 0; index < bytes.length; index += 1) bytes[index] = Math.floor(Math.random() * 256);
            }
            return Array.from(bytes, value => value.toString(16).padStart(2, "0")).join("");
        }

        function loadOrCreateClientId() {
            try {
                const saved = localStorage.getItem(CLIENT_ID_KEY);
                if (/^[A-Za-z0-9._:-]{8,64}$/.test(saved || "")) return saved;
                const created = `tgweb.${randomAscii(12)}`;
                localStorage.setItem(CLIENT_ID_KEY, created);
                return created;
            } catch (_) {
                return `tgweb.${randomAscii(12)}`;
            }
        }

        function nextSequence() {
            let sequence = 0;
            try {
                sequence = Number.parseInt(localStorage.getItem(SEQUENCE_KEY) || "0", 10);
                if (!Number.isSafeInteger(sequence) || sequence < 0) sequence = 0;
                sequence += 1;
                localStorage.setItem(SEQUENCE_KEY, String(sequence));
            } catch (_) {
                sequence = Math.floor(Date.now() / 1000);
            }
            return sequence;
        }

        function normalizeScanValue(value) {
            return String(value || "")
                .normalize("NFKC")
                .replace(/[\u0000-\u001f\u007f-\u009f]/g, "")
                .trim()
                .toUpperCase();
        }

        function displayScanValue(value) {
            const normalized = normalizeScanValue(value);
            if (/^[A-Z0-9]+(?:[+._'-][A-Z0-9]+)+$/.test(normalized)) {
                return normalized.replace(/'/g, "-");
            }
            return normalized;
        }

        function buildEnvelope(rawValue, transport) {
            const normalized = normalizeScanValue(rawValue);
            if (!normalized || normalized.length > 256) throw new Error("扫码内容为空或长度异常");
            const sequence = nextSequence();
            return {
                event_id: `${state.clientId}:${String(sequence).padStart(8, "0")}:${randomAscii(4)}`,
                device_id: state.deviceId || state.clientId,
                operator_id: state.operatorId || 0,
                raw_value: String(rawValue || ""),
                normalized_value: normalized,
                barcode: normalized,
                transport,
                scanned_at: new Date().toISOString(),
                tenant_id: "default",
                api_base: state.legacyMode ? "" : apiBase,
                order_id: "",
                quantity: 1,
                local_sequence: sequence,
                schema_version: "1.0",
            };
        }

        function requestPayload(envelope) {
            if (envelope.kind === "quantity_override") {
                return {
                    event_id: envelope.event_id,
                    order_id: envelope.order_id,
                    revision: envelope.revision,
                    session_started_at: envelope.session_started_at,
                    barcode: envelope.barcode,
                    target_scan_event_id: envelope.target_scan_event_id,
                    expected_actual_quantity: envelope.expected_actual_quantity,
                    quantity: envelope.quantity,
                    unit: envelope.unit,
                    transport: envelope.transport,
                    adjusted_at: envelope.adjusted_at,
                    local_sequence: envelope.local_sequence,
                    schema_version: envelope.schema_version,
                };
            }
            return {
                event_id: envelope.event_id,
                order_id: envelope.order_id,
                barcode: envelope.barcode,
                quantity: envelope.quantity,
                transport: envelope.transport,
                raw_value: envelope.raw_value,
                scanned_at: envelope.scanned_at,
                local_sequence: envelope.local_sequence,
                schema_version: envelope.schema_version,
            };
        }

        function setConnection(kind, text) {
            elements.connectionDot.className = `dot${kind ? ` ${kind}` : ""}`;
            elements.connectionText.textContent = text;
        }

        function showResult(text, strong = false) {
            elements.lastResult.textContent = String(text || "");
            elements.lastResult.classList.toggle("strong", strong);
        }

        function showError(error) {
            const message = error && error.message ? error.message : String(error || "未知错误");
            showResult(`⚠️ ${message}`, true);
        }

        function setLastProduct(target = null) {
            const normalizedBarcode = normalizeScanValue(target?.barcode || "");
            const revision = Number(target?.revision || 0);
            const orderId = String(target?.orderId || "").trim();
            const sessionStartedAt = String(target?.sessionStartedAt || "").trim();
            const targetScanEventId = String(target?.targetScanEventId || "").trim();
            const expectedActualQuantity = Number(target?.expectedActualQuantity);
            if (
                !orderId
                || revision <= 0
                || !sessionStartedAt
                || !targetScanEventId
                || !Number.isInteger(expectedActualQuantity)
                || expectedActualQuantity < 0
                || !/^[0-9]{6,18}$/.test(normalizedBarcode)
            ) {
                state.lastProduct = null;
                elements.quantityPanel.hidden = true;
                elements.quantityTarget.textContent = "请先扫描商品条码";
                return;
            }
            state.lastProduct = {
                orderId,
                revision,
                sessionStartedAt,
                barcode: normalizedBarcode,
                targetScanEventId,
                expectedActualQuantity,
            };
            elements.quantityTarget.textContent = `当前商品：${normalizedBarcode}`;
            elements.quantityPanel.hidden = state.legacyMode;
        }

        function formatSession(payload) {
            if (!payload || payload.status === "idle") return "当前没有活动出库订单；可扫描订单、商品或库位。";
            const orderId = payload.order_id || "未标注";
            const totals = Number.isFinite(payload.scanned_total) && Number.isFinite(payload.ordered_total)
                ? `${payload.scanned_total}/${payload.ordered_total} 件` : "";
            const products = Number.isFinite(payload.scanned_products) && Number.isFinite(payload.ordered_products)
                ? `${payload.scanned_products}/${payload.ordered_products} 款` : "";
            const pending = Number.isFinite(payload.pending_products)
                ? Number(payload.pending_products)
                : (state.activeSession?.pending_lines?.length || 0);
            return `订单 ${orderId}${totals ? `\n进度 ${totals}` : ""}${products ? `；商品 ${products}` : ""}${pending > 0 ? `\n待确认 ${pending} 条` : ""}`;
        }

        function renderAttention(payload) {
            if (!payload || payload.status === "idle") {
                state.attentionItems = [];
            } else if (Array.isArray(payload.attention_items)) {
                state.attentionItems = payload.attention_items;
            } else if (
                payload.barcode
                && Number.isFinite(payload.expected_quantity)
                && Number.isFinite(payload.actual_quantity)
            ) {
                const barcode = String(payload.barcode);
                const retained = state.attentionItems.filter(item => item.barcode !== barcode);
                let status = "";
                if (Number(payload.expected_quantity) <= 0 && (
                    Number(payload.actual_quantity) > 0 || payload.warning_code === "unexpected_product"
                )) {
                    status = "unexpected";
                } else if (Number(payload.actual_quantity) > Number(payload.expected_quantity)) {
                    status = "over";
                }
                if (status) {
                    retained.unshift({
                        barcode,
                        sku: "",
                        expected_quantity: Number(payload.expected_quantity),
                        actual_quantity: Number(payload.actual_quantity),
                        difference_quantity: Number(payload.actual_quantity) - Number(payload.expected_quantity),
                        status,
                    });
                }
                state.attentionItems = retained;
            }
            const items = state.attentionItems;
            elements.attentionPanel.hidden = items.length === 0;
            elements.attentionList.replaceChildren();
            if (!items.length) return;
            const labels = {
                unexpected: ["订单外", "danger"],
                over: ["超配", "danger"],
                short: ["少配", ""],
            };
            elements.attentionHeading.textContent = `当前需要处理 · ${items.length} 款`;
            for (const item of items) {
                const [label, level] = labels[item.status] || ["需核对", ""];
                const card = document.createElement("div");
                card.className = `attention-item${level ? ` ${level}` : ""}`;
                const title = document.createElement("div");
                title.className = "attention-item-title";
                const identity = item.sku
                    ? `${item.sku} · ${item.barcode}`
                    : item.barcode;
                title.textContent = `${label}｜${identity}`;
                const meta = document.createElement("div");
                meta.className = "attention-item-meta";
                if (item.status === "unexpected") {
                    meta.textContent = Number(item.actual_quantity) === 0
                        ? "数量未确认（未计入件数）· 请核对条码；误扫须移除"
                        : `订单 0 件 · 已扫 ${item.actual_quantity} 件`;
                } else {
                    const difference = Math.abs(Number(item.difference_quantity || 0));
                    meta.textContent = `应配 ${item.expected_quantity} 件 · 已扫 ${item.actual_quantity} 件 · ${label} ${difference} 件`;
                }
                card.append(title, meta);
                elements.attentionList.appendChild(card);
            }
        }

        function selectedPendingLine() {
            const pendingLines = Array.isArray(state.activeSession?.pending_lines)
                ? state.activeSession.pending_lines
                : [];
            return pendingLines.find(item => item.line_id === elements.pendingSelect.value) || null;
        }

        function renderPendingDetail(line) {
            elements.pendingDetail.replaceChildren();
            if (!line) return;
            const main = document.createElement("div");
            main.className = "pending-item-main";
            main.textContent = `${line.sku || "未标注货号"} · ${line.quantity} 件`;
            const description = document.createElement("div");
            description.className = "pending-description";
            description.textContent = line.description || `PDF 第${line.source_page || "?"}页订单商品`;
            const reason = document.createElement("div");
            reason.className = "pending-reason";
            reason.textContent = `不能自动确认：${line.reason || "需要操作员指定实际商品"}`;
            elements.pendingDetail.append(main, description, reason);
        }

        function pendingAllocationEntries() {
            try {
                return parsePendingAllocations(elements.pendingAllocations.value);
            } catch (_) {
                return {};
            }
        }

        function writePendingAllocations(allocations) {
            elements.pendingAllocations.value = Object.entries(allocations)
                .map(([barcode, quantity]) => `${barcode}=${quantity}`)
                .join("\n");
            renderPendingAllocationList();
        }

        function renderPendingAllocationList() {
            const allocations = pendingAllocationEntries();
            elements.pendingAllocationList.replaceChildren();
            for (const [barcode, quantity] of Object.entries(allocations)) {
                const row = document.createElement("div");
                row.className = "allocation-item";
                const text = document.createElement("span");
                text.textContent = `${barcode} × ${quantity} 件`;
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "allocation-remove";
                remove.textContent = "移除";
                remove.addEventListener("click", () => {
                    const current = pendingAllocationEntries();
                    delete current[barcode];
                    writePendingAllocations(current);
                });
                row.append(text, remove);
                elements.pendingAllocationList.appendChild(row);
            }
            const line = selectedPendingLine();
            if (!line) return;
            const assigned = Object.values(allocations).reduce((sum, value) => sum + value, 0);
            const remaining = Math.max(0, Number(line.quantity || 0) - assigned);
            elements.pendingQuantity.value = remaining > 0 ? String(remaining) : "";
        }

        function resetPendingEditor(line) {
            elements.pendingBarcode.value = "";
            elements.pendingAllocations.value = "";
            elements.pendingQuantity.value = line ? String(line.quantity || "") : "";
            elements.pendingAllocationList.replaceChildren();
        }

        function pendingEditorKey(line) {
            if (!line) return "";
            const session = state.activeSession || {};
            return [
                session.order_id || "",
                session.session_started_at || "",
                line.line_id || "",
            ].join(":");
        }

        function addPendingAllocation() {
            const line = selectedPendingLine();
            const barcode = normalizeScanValue(elements.pendingBarcode.value);
            const quantity = Number.parseInt(elements.pendingQuantity.value || "", 10);
            if (!line) {
                showError("请先选择待确认订单商品");
                return;
            }
            if (!/^[0-9]{6,18}$/.test(barcode)) {
                showError("请扫描或填写 6 至 18 位商品条码");
                elements.pendingBarcode.focus();
                return;
            }
            if (!Number.isInteger(quantity) || quantity <= 0) {
                showError("分配件数必须是大于 0 的整数");
                elements.pendingQuantity.focus();
                return;
            }
            const allocations = pendingAllocationEntries();
            const currentTotal = Object.values(allocations).reduce((sum, value) => sum + value, 0);
            if (currentTotal + quantity > Number(line.quantity || 0)) {
                showError(`分配后超过原订单数量 ${line.quantity} 件`);
                return;
            }
            allocations[barcode] = (allocations[barcode] || 0) + quantity;
            writePendingAllocations(allocations);
            elements.pendingBarcode.value = "";
            elements.pendingBarcode.focus();
        }

        function renderPending(payload) {
            if (!payload || payload.status === "idle") {
                state.activeSession = null;
                state.pendingEditorKey = "";
                elements.pendingPanel.hidden = true;
                elements.pendingSelect.replaceChildren();
                delete elements.pendingSelect.dataset.signature;
                elements.pendingAllocations.value = "";
                return;
            }
            if (!Array.isArray(payload.pending_lines)) return;
            const previousLineId = elements.pendingSelect.value;
            state.activeSession = payload;
            const pendingLines = payload.pending_lines;
            elements.pendingPanel.hidden = pendingLines.length === 0;
            elements.pendingTitle.textContent = `⚠️ 先处理待确认商品 · ${pendingLines.length} 条`;
            const signature = JSON.stringify(
                pendingLines.map(line => [line.line_id, line.sku || "", line.quantity])
            );
            if (elements.pendingSelect.dataset.signature !== signature) {
                elements.pendingSelect.replaceChildren();
                for (const line of pendingLines) {
                    const option = document.createElement("option");
                    option.value = line.line_id;
                    option.textContent = `${line.sku || line.line_id} · ${line.quantity}件`;
                    elements.pendingSelect.appendChild(option);
                }
                elements.pendingSelect.dataset.signature = signature;
            }
            const line = pendingLines.find(item => item.line_id === previousLineId)
                || pendingLines[0]
                || null;
            if (line) elements.pendingSelect.value = line.line_id;
            renderPendingDetail(line);
            const editorKey = pendingEditorKey(line);
            if (state.pendingEditorKey !== editorKey) {
                state.pendingEditorKey = editorKey;
                resetPendingEditor(line);
            }
            elements.pendingConfirmButton.disabled = pendingLines.length === 0;
        }

        function updatePendingDetail() {
            const line = selectedPendingLine();
            renderPendingDetail(line);
            state.pendingEditorKey = pendingEditorKey(line);
            resetPendingEditor(line);
        }

        function renderAck(payload, envelope) {
            const duplicateHasCurrentSnapshot = payload.status !== "duplicate" || (
                Number.isFinite(payload.revision)
                && Number.isFinite(payload.scanned_total)
            );
            if (
                payload.status === "idle"
                || (payload.order_id && duplicateHasCurrentSnapshot)
            ) {
                elements.sessionText.textContent = formatSession(payload);
            }
            renderAttention(payload);
            if (payload.status === "idle" || Array.isArray(payload.pending_lines)) {
                renderPending(payload);
            }
            if (payload.status === "idle") {
                setLastProduct();
            } else if (payload.status === "accepted" && envelope?.kind !== "quantity_override") {
                setLastProduct({
                    orderId: payload.order_id,
                    revision: payload.revision,
                    sessionStartedAt: payload.session_started_at,
                    barcode: payload.barcode,
                    targetScanEventId: payload.event_id === envelope.event_id
                        ? envelope.event_id
                        : "",
                    expectedActualQuantity: payload.actual_quantity,
                });
            } else if (payload.status === "adjusted" && envelope?.kind === "quantity_override") {
                setLastProduct({
                    orderId: payload.order_id,
                    revision: payload.revision,
                    sessionStartedAt: payload.session_started_at,
                    barcode: payload.barcode,
                    targetScanEventId: envelope.target_scan_event_id,
                    expectedActualQuantity: payload.actual_quantity,
                });
            } else if (
                payload.status === "duplicate"
                || payload.status === "order_started"
                || payload.status === "query_result"
            ) {
                // 重放 ACK 与订单摘要里的 last_barcode 都是全局状态，
                // 多终端并发时不能据此认定“本终端刚扫商品”。
                setLastProduct();
            }
            if (payload.status === "query_result") {
                showResult(payload.message || `已查询 ${payload.reference || displayScanValue(envelope.barcode)}`, true);
            } else if (payload.status === "order_started") {
                showResult(payload.message || `订单 ${payload.order_id} 已载入`, true);
            } else if (payload.status === "adjusted") {
                showResult(payload.message || `${payload.barcode}：数量已修改`, true);
            } else if (payload.status === "duplicate" && envelope?.kind === "quantity_override") {
                showResult(payload.message || `${payload.barcode}：数量调整已处理`, true);
            } else if (payload.status === "accepted" || payload.status === "duplicate") {
                const label = payload.status === "duplicate" ? "重复事件已确认，未重复计数" : "已入账";
                const sessionSummary = duplicateHasCurrentSnapshot
                    ? `\n${formatSession(payload)}`
                    : "";
                showResult(`${displayScanValue(envelope.barcode)}：${label}${sessionSummary}`, true);
            } else {
                showResult(payload.message || `${displayScanValue(envelope.barcode)}：服务器已确认`, true);
            }
            if (
                payload.status === "accepted"
                && (
                    payload.warning_code
                    || (
                        Number(payload.ordered_total || 0) > 0
                        && Number(payload.scanned_total || 0) >= Number(payload.ordered_total || 0)
                    )
                )
            ) {
                refreshAttentionAfterCriticalAck();
            }
        }

        function openDatabase() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject(new Error("当前浏览器不支持本地待发队列"));
                    return;
                }
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = () => {
                    const database = request.result;
                    if (!database.objectStoreNames.contains(STORE_PENDING)) {
                        database.createObjectStore(STORE_PENDING, { keyPath: "event_id" });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error || new Error("本地队列初始化失败"));
            });
        }

        function getPending() {
            return new Promise((resolve, reject) => {
                const transaction = state.db.transaction(STORE_PENDING, "readonly");
                const request = transaction.objectStore(STORE_PENDING).getAll();
                request.onsuccess = () => resolve((request.result || []).sort((a, b) => a.local_sequence - b.local_sequence));
                request.onerror = () => reject(request.error);
            });
        }

        function putPending(envelope) {
            return new Promise((resolve, reject) => {
                const transaction = state.db.transaction(STORE_PENDING, "readwrite");
                const request = transaction.objectStore(STORE_PENDING).put(envelope);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function deletePending(eventId) {
            return new Promise((resolve, reject) => {
                const transaction = state.db.transaction(STORE_PENDING, "readwrite");
                const request = transaction.objectStore(STORE_PENDING).delete(eventId);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function isCurrentQueueOwner(envelope) {
            return Boolean(
                state.deviceId
                && envelope
                && envelope.device_id === state.deviceId
                && envelope.api_base === apiBase
            );
        }

        async function updateQueueCount() {
            if (!state.db) return;
            const pending = await getPending();
            const current = pending.filter(isCurrentQueueOwner).length;
            const retained = pending.length - current;
            elements.queueText.textContent = retained > 0
                ? `本终端待发送：${current} 条；其他终端保留：${retained} 条`
                : `待发送：${current} 条`;
            elements.queueText.classList.toggle("has-items", current > 0);
            const quantityPending = pending.some(
                envelope => isCurrentQueueOwner(envelope)
                    && (
                        envelope.kind === "quantity_override"
                        || envelope.kind === undefined
                        || envelope.kind === "scan"
                    )
            );
            setQuantityControlsDisabled(
                quantityPending || state.cameraActive || state.quantitySubmitting
            );
        }

        async function fetchJson(url, options = {}, timeoutMs = API_TIMEOUT_MS) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                let payload = {};
                try { payload = await response.json(); } catch (_) {}
                if (!response.ok) {
                    const error = new Error(payload.detail || payload.message || `HTTP ${response.status}`);
                    error.status = response.status;
                    throw error;
                }
                return payload;
            } finally {
                clearTimeout(timer);
            }
        }

        async function exchangeWebSession(force = false) {
            if (!force && state.accessToken && Date.now() < state.tokenExpiresAt - 30000) return;
            if (state.sessionPromise) return state.sessionPromise;
            state.sessionPromise = (async () => {
                if (!tg.initData) throw new Error("当前入口没有 Telegram 安全身份，请从机器人内的扫码终端菜单重新打开");
                if (!apiBase) throw new Error("扫码服务地址无效");
                const payload = await fetchJson(`${apiBase}${SESSION_PATH}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ init_data: tg.initData, client_id: state.clientId }),
                });
                if (!payload.access_token || !payload.device_id) throw new Error("扫码服务没有返回完整的短期会话");
                state.accessToken = payload.access_token;
                state.deviceId = payload.device_id;
                state.operatorId = Number(payload.operator_id || 0);
                state.dispatchPath = payload.dispatch_url || DEFAULT_DISPATCH_PATH;
                state.tokenExpiresAt = Date.now() + Math.max(60, Number(payload.expires_in || 300)) * 1000;
                setConnection("online", "扫码服务已连接");
            })();
            try {
                await state.sessionPromise;
            } finally {
                state.sessionPromise = null;
            }
        }

        function authorizedHeaders() {
            return {
                "Authorization": `Bearer ${state.accessToken}`,
                "X-Scanner-Device-Id": state.deviceId,
                "Content-Type": "application/json",
            };
        }

        async function loadServerSession() {
            await exchangeWebSession();
            const payload = await fetchJson(`${apiBase}${SESSION_STATE_PATH}`, { headers: authorizedHeaders() });
            elements.sessionText.textContent = formatSession(payload);
            renderAttention(payload);
            renderPending(payload);
            // 会话摘要中的 last_barcode 可能来自另一台终端；刷新后要求本机重扫。
            setLastProduct();
        }

        async function loadServerAttentionPreservingLocalProduct() {
            await exchangeWebSession();
            const payload = await fetchJson(`${apiBase}${SESSION_STATE_PATH}`, { headers: authorizedHeaders() });
            elements.sessionText.textContent = formatSession(payload);
            renderAttention(payload);
            renderPending(payload);
        }

        function refreshAttentionAfterCriticalAck() {
            if (state.attentionRefreshPromise) return;
            state.attentionRefreshPromise = loadServerAttentionPreservingLocalProduct()
                .catch(() => {})
                .finally(() => { state.attentionRefreshPromise = null; });
        }

        function parsePendingAllocations(rawText) {
            const allocations = {};
            const lines = String(rawText || "")
                .normalize("NFKC")
                .split(/[\n,，;；]+/)
                .map(item => item.trim())
                .filter(Boolean);
            for (const line of lines) {
                const match = line.match(/^'?([0-9]{6,18})\s*(?:=|:|：|\*)\s*([1-9]\d{0,6})$/);
                if (!match) throw new Error(`分配格式无效：${line}`);
                allocations[match[1]] = (allocations[match[1]] || 0) + Number(match[2]);
            }
            if (!Object.keys(allocations).length) throw new Error("请填写商品条码和数量");
            return allocations;
        }

        async function submitPendingResolution() {
            const line = selectedPendingLine();
            const session = state.activeSession;
            if (!line || !session) {
                showError("待确认商品状态已变化，请刷新订单");
                return;
            }
            let allocations;
            try {
                allocations = parsePendingAllocations(elements.pendingAllocations.value);
            } catch (error) {
                showError(error);
                elements.pendingAllocations.focus();
                return;
            }
            const total = Object.values(allocations).reduce((sum, value) => sum + value, 0);
            if (total !== Number(line.quantity || 0)) {
                showError(`分配合计 ${total} 件，必须等于订单数量 ${line.quantity} 件`);
                elements.pendingAllocations.focus();
                return;
            }
            state.pendingSubmitting = true;
            elements.pendingConfirmButton.disabled = true;
            try {
                await exchangeWebSession();
                const payload = await fetchJson(`${apiBase}${SESSION_ACTION_PATH}`, {
                    method: "POST",
                    headers: authorizedHeaders(),
                    body: JSON.stringify({
                        action: "resolve_pending",
                        order_id: session.order_id,
                        revision: session.revision,
                        session_started_at: session.session_started_at,
                        pending_line_id: line.line_id,
                        allocations,
                        schema_version: "1.0",
                    }),
                });
                elements.pendingAllocations.value = "";
                elements.sessionText.textContent = formatSession(payload);
                renderPending(payload);
                showResult(payload.message || "待确认商品已完成分配", true);
                playBeep();
            } catch (error) {
                showError(error);
                try { await loadServerSession(); } catch (_) {}
            } finally {
                state.pendingSubmitting = false;
                elements.pendingConfirmButton.disabled = elements.pendingPanel.hidden;
                armHidCapture();
            }
        }

        async function sendEnvelope(envelope, refreshed = false) {
            await exchangeWebSession();
            try {
                const path = envelope.kind === "quantity_override"
                    ? QUANTITY_PATH
                    : state.dispatchPath;
                return await fetchJson(`${apiBase}${path}`, {
                    method: "POST",
                    headers: authorizedHeaders(),
                    body: JSON.stringify(requestPayload(envelope)),
                });
            } catch (error) {
                if (error.status === 401 && !refreshed) {
                    state.accessToken = "";
                    state.tokenExpiresAt = 0;
                    await exchangeWebSession(true);
                    return sendEnvelope(envelope, true);
                }
                throw error;
            }
        }

        function setQuantityControlsDisabled(disabled) {
            elements.quantityInput.disabled = disabled;
            elements.quantityConfirmButton.disabled = disabled;
        }

        async function submitQuantityAdjustment() {
            const target = state.lastProduct;
            if (!target) {
                showError("请先扫描要修改的商品条码");
                armHidCapture();
                return;
            }
            const command = String(elements.quantityInput.value || "")
                .normalize("NFKC")
                .replace(/\s+/g, "");
            const packageMatch = command.match(/^([1-9]\d{0,6})(?:包|箱)$/);
            const pieceMatch = command.match(/^(?:实际)?([1-9]\d{0,6})件$/);
            const match = packageMatch || pieceMatch;
            const quantity = match ? Number.parseInt(match[1], 10) : 0;
            const unit = packageMatch ? "package" : "piece";
            if (!match || quantity > 1000000) {
                showError("请输入“50包”或“11件”，数量范围 1 至 1000000");
                elements.quantityInput.focus();
                return;
            }
            const sequence = nextSequence();
            const envelope = {
                kind: "quantity_override",
                event_id: `${state.clientId}:qty:${String(sequence).padStart(8, "0")}:${randomAscii(4)}`,
                device_id: state.deviceId,
                api_base: apiBase,
                order_id: target.orderId,
                revision: target.revision,
                session_started_at: target.sessionStartedAt,
                barcode: target.barcode,
                target_scan_event_id: target.targetScanEventId,
                expected_actual_quantity: target.expectedActualQuantity,
                quantity,
                unit,
                transport: "telegram_web",
                raw_value: unit === "package"
                    ? `${target.barcode}改为${quantity}包`
                    : `${quantity}件`,
                adjusted_at: new Date().toISOString(),
                local_sequence: sequence,
                schema_version: "1.0",
            };
            state.quantitySubmitting = true;
            setQuantityControlsDisabled(true);
            try {
                await putPending(envelope);
                await updateQueueCount();
                elements.quantityInput.value = "";
                playBeep();
                showResult(`${target.barcode}\n${command} 已进入待发队列`, true);
            } catch (error) {
                showError(`数量调整未能保存：${error.message || error}`);
            } finally {
                state.quantitySubmitting = false;
                await updateQueueCount();
                armHidCapture();
            }
            processQueue();
        }

        async function processQueue() {
            if (state.processingQueue || state.legacyMode || !state.db) return;
            state.processingQueue = true;
            try {
                while (true) {
                    const pending = await getPending();
                    await updateQueueCount();
                    if (!pending.length) break;
                    const envelope = pending.find(isCurrentQueueOwner);
                    if (!envelope) {
                        showResult("已安全保留其他账号或服务器的待发扫码", true);
                        break;
                    }
                    try {
                        setConnection(
                            "",
                            envelope.kind === "quantity_override"
                                ? "正在发送数量调整…"
                                : "正在发送扫码事件…"
                        );
                        const payload = await sendEnvelope(envelope);
                        await deletePending(envelope.event_id);
                        renderAck(payload, envelope);
                        setConnection("online", "扫码服务已连接");
                    } catch (error) {
                        if (error.status === 422) {
                            await deletePending(envelope.event_id);
                            const detail = String(error.message || "扫码内容无法识别");
                            if (envelope.kind === "quantity_override") {
                                showError(`${detail}；数量未修改，可返回 Telegram 发送“${envelope.raw_value}”`);
                                setConnection("online", "扫码服务已连接");
                                continue;
                            }
                            const suffix = detail.includes("本次未计数")
                                ? ""
                                : "；本次未计数";
                            showError(`${detail}${suffix}，请重新完整扫描`);
                            elements.hidPreview.textContent = `未计数：${displayScanValue(envelope.barcode)}（长度 ${envelope.barcode.length}）`;
                            setConnection("online", "扫码服务已连接");
                            continue;
                        }
                        if (error.status === 409) {
                            if (envelope.kind === "quantity_override") {
                                await deletePending(envelope.event_id);
                                showError(`${error.message || error}；陈旧数量调整已取消`);
                                setLastProduct();
                                try { await loadServerSession(); } catch (_) {}
                                setConnection("online", "扫码服务已连接");
                                continue;
                            }
                            showError(error);
                            setConnection("error", "需要先处理当前业务状态");
                        } else if (error.status === 401 || error.status === 403) {
                            showError("安全会话已失效，请关闭后从 Telegram 重新打开");
                            setConnection("error", "安全会话失效");
                        } else {
                            showError("网络暂不可用，扫码已保存在本机待发送队列");
                            setConnection("error", "连接中断，已安全暂存");
                        }
                        break;
                    }
                }
            } finally {
                state.processingQueue = false;
                await updateQueueCount();
                armHidCapture();
            }
        }

        function canUseLegacySendData() {
            return Boolean(
                window.Telegram
                && window.Telegram.WebApp
                && tg.platform
                && tg.platform !== "unknown"
                && typeof tg.sendData === "function"
            );
        }

        async function submitAutomaticScan(rawValue, transport) {
            if (!state.legacyMode && !state.deviceId) {
                throw new Error("首次使用必须先连接扫码服务，当前扫码未入队");
            }
            const envelope = buildEnvelope(rawValue, transport);
            if (state.legacyMode) {
                if (!canUseLegacySendData()) throw new Error("当前页面不在 Telegram 中，无法使用兼容扫码");
                showResult("兼容模式正在发送单次扫码…", true);
                tg.sendData(envelope.barcode);
                tg.close();
                return;
            }
            setLastProduct();
            await putPending(envelope);
            await updateQueueCount();
            playBeep();
            showResult(`${displayScanValue(envelope.barcode)}\n已进入待发队列`, true);
            processQueue();
        }

        async function submitMoveScan(rawValue) {
            if (!state.legacyMode) {
                throw new Error("显式移库请从 Telegram 摄像头单次入口打开");
            }
            const normalized = normalizeScanValue(rawValue);
            if (!normalized) return;
            if (state.moveStep === 1) {
                state.moveProduct = normalized;
                state.moveStep = 2;
                elements.hidHelp.innerHTML = `已锁定产品: <span class="move-step">${escapeHtml(displayScanValue(normalized))}</span><br>第二步：扫描新库位码`;
                showResult(`产品 ${displayScanValue(normalized)} 已锁定`, true);
                playBeep();
                return;
            }
            if (normalized === state.moveProduct) {
                showError("新库位码不能与产品码相同");
                return;
            }
            if (!canUseLegacySendData()) throw new Error("当前页面不在 Telegram 中，无法提交移库");
            playBeep();
            tg.sendData(`MOVE_LOC|${state.moveProduct}|${normalized}`);
            tg.close();
        }

        async function handleScan(rawValue, transport) {
            const normalized = normalizeScanValue(rawValue);
            if (!normalized) return;
            elements.hidPreview.textContent = displayScanValue(normalized);
            try {
                if (state.mode === "MOVE") await submitMoveScan(rawValue);
                else await submitAutomaticScan(rawValue, transport);
            } catch (error) {
                showError(error);
            } finally {
                elements.hidCapture.value = "";
                armHidCapture();
            }
        }

        function escapeHtml(value) {
            const node = document.createElement("span");
            node.textContent = value;
            return node.innerHTML;
        }

        function playBeep() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = context.createOscillator();
                const gain = context.createGain();
                oscillator.connect(gain);
                gain.connect(context.destination);
                oscillator.frequency.value = 880;
                gain.gain.value = 0.22;
                oscillator.start();
                oscillator.stop(context.currentTime + 0.08);
            } catch (_) {}
            if (tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === "function") {
                tg.HapticFeedback.impactOccurred("light");
            }
        }

        function resetHidFrame() {
            clearTimeout(state.hidTimer);
            state.hidTimer = null;
            state.hidPendingTerminator = false;
            elements.hidCapture.value = "";
        }

        function expireHidFrame() {
            const normalized = normalizeScanValue(elements.hidCapture.value);
            resetHidFrame();
            elements.hidPreview.textContent = "输入框已就绪";
            if (normalized) {
                showError("未收到扫码枪结束符，本次未发送；请设置 Enter/CR 后重新扫描");
            }
            armHidCapture();
        }

        function scheduleHidFrameTimeout() {
            clearTimeout(state.hidTimer);
            const normalized = normalizeScanValue(elements.hidCapture.value);
            elements.hidPreview.textContent = normalized
                ? `已接收 ${normalized.length} 个字符，等待结束符…`
                : "输入框已就绪";
            if (!normalized) return;
            state.hidTimer = setTimeout(expireHidFrame, HID_FRAME_TIMEOUT_MS);
        }

        function flushHidFrame() {
            const rawValue = String(elements.hidCapture.value || "");
            const normalized = normalizeScanValue(rawValue);
            resetHidFrame();
            if (!normalized) {
                showError("没有收到扫码内容，请点击输入框后重新扫描");
                elements.hidPreview.textContent = "输入框已就绪";
                armHidCapture();
                return;
            }
            handleScan(rawValue, "hid");
        }

        function scheduleHidInput() {
            if (state.cameraActive) return;
            scheduleHidFrameTimeout();
        }

        function handleHidKeydown(event) {
            if (state.cameraActive) return;
            const code = String(event.code || "");
            const key = String(event.key || "");
            const terminator = (
                code === "Enter"
                || code === "NumpadEnter"
                || code === "Tab"
                || key === "Enter"
                || key === "Tab"
                || event.keyCode === 13
                || event.keyCode === 9
            );
            if (terminator) {
                event.preventDefault();
                if (state.composing || event.isComposing) {
                    state.hidPendingTerminator = true;
                } else {
                    setTimeout(flushHidFrame, 0);
                }
                return;
            }
        }

        function hidEditingTarget(target) {
            return (
                target === elements.quantityInput
                || target === elements.pendingSelect
                || target === elements.pendingBarcode
                || target === elements.pendingQuantity
                || target === elements.pendingAllocations
                || (target instanceof HTMLInputElement && target !== elements.hidCapture)
                || target instanceof HTMLTextAreaElement
                || Boolean(target && target.isContentEditable)
            );
        }

        function focusHidCaptureNow() {
            if (
                state.cameraActive
                || state.quantitySubmitting
                || state.pendingSubmitting
                || document.hidden
                || hidEditingTarget(document.activeElement)
            ) return false;
            try { elements.hidCapture.focus({ preventScroll: true }); }
            catch (_) { elements.hidCapture.focus(); }
            return document.activeElement === elements.hidCapture;
        }

        function captureHidKeyBeforeFocus(event) {
            if (
                state.cameraActive
                || state.quantitySubmitting
                || state.pendingSubmitting
                || state.composing
                || event.defaultPrevented
                || event.ctrlKey
                || event.altKey
                || event.metaKey
                || event.target === elements.hidCapture
                || hidEditingTarget(event.target)
            ) return;
            const code = String(event.code || "");
            const key = String(event.key || "");
            const terminator = (
                code === "Enter"
                || code === "NumpadEnter"
                || code === "Tab"
                || key === "Enter"
                || key === "Tab"
                || event.keyCode === 13
                || event.keyCode === 9
            );
            const character = (
                key.length === 1 && /^[A-Za-z0-9+._'-]$/.test(key)
            ) ? key : "";
            if (!character && !(terminator && normalizeScanValue(elements.hidCapture.value))) {
                return;
            }
            event.preventDefault();
            focusHidCaptureNow();
            if (character) {
                elements.hidCapture.value += character;
                scheduleHidInput();
            } else {
                setTimeout(flushHidFrame, 0);
            }
        }

        function armHidCapture() {
            if (
                state.cameraActive
                || state.quantitySubmitting
                || state.pendingSubmitting
                || hidEditingTarget(document.activeElement)
            ) return;
            setTimeout(focusHidCaptureNow, 80);
        }

        function restoreHidCaptureAfterPageResume() {
            resetHidFrame();
            elements.hidPreview.textContent = "输入框已就绪";
            focusHidCaptureNow();
            armHidCapture();
        }

        function switchMode(mode) {
            if (mode === "MOVE" && !state.legacyMode) {
                state.mode = "AUTO";
                showError("常驻扫码终端不执行移库；请使用 Telegram 摄像头单次入口");
                armHidCapture();
                return;
            }
            state.mode = mode;
            state.moveStep = 1;
            state.moveProduct = "";
            elements.tabAuto.classList.toggle("active", mode === "AUTO");
            elements.tabMove.classList.toggle("active", mode === "MOVE");
            if (mode === "MOVE") {
                elements.hidHelp.innerHTML = "显式移库第一步：扫描 <span class=\"move-step\">产品条码</span>";
                showResult("移库模式不会自动猜测业务；请依次扫描产品和新库位。", true);
            } else {
                elements.hidHelp.textContent = "保持本页面开启，直接连续扫码；订单、商品和库位由服务端精确判断。";
                showResult("智能扫码已恢复", false);
            }
            armHidCapture();
        }

        function loadCameraDecoder() {
            if (typeof window.Html5Qrcode === "function") return Promise.resolve();
            if (state.cameraDecoderPromise) return state.cameraDecoderPromise;
            state.cameraDecoderPromise = new Promise((resolve, reject) => {
                const script = document.createElement("script");
                let settled = false;
                const finish = error => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    script.onload = null;
                    script.onerror = null;
                    if (error) {
                        script.remove();
                        state.cameraDecoderPromise = null;
                        reject(error);
                        return;
                    }
                    if (typeof window.Html5Qrcode !== "function") {
                        script.remove();
                        state.cameraDecoderPromise = null;
                        reject(new Error("摄像头解码组件加载结果异常，请重试"));
                        return;
                    }
                    resolve();
                };
                const timer = setTimeout(
                    () => finish(new Error("摄像头解码组件加载超时，请检查网络后重试")),
                    CAMERA_DECODER_TIMEOUT_MS
                );
                script.src = CAMERA_DECODER_URL;
                script.async = true;
                script.crossOrigin = "anonymous";
                script.onload = () => finish(null);
                script.onerror = () => finish(new Error("摄像头解码组件加载失败，请检查网络后重试"));
                document.head.appendChild(script);
            });
            return state.cameraDecoderPromise;
        }

        async function startCamera() {
            if (state.cameraActive) return;
            await loadCameraDecoder();
            resetHidFrame();
            state.camera = state.camera || new Html5Qrcode("reader");
            elements.cameraPanel.classList.add("active");
            elements.cameraButton.textContent = "⏹ 关闭摄像头";
            state.cameraActive = true;
            setQuantityControlsDisabled(true);
            elements.hidCapture.blur();
            try {
                await state.camera.start(
                    { facingMode: "environment" },
                    { fps: 18, qrbox: { width: 280, height: 190 }, aspectRatio: 1.0 },
                    onCameraScan,
                    () => {}
                );
            } catch (_) {
                state.cameraActive = false;
                await updateQueueCount();
                elements.cameraPanel.classList.remove("active");
                elements.cameraButton.textContent = "📷 启用摄像头备用";
                armHidCapture();
                throw new Error("摄像头启动失败，请检查权限");
            }
        }

        async function stopCamera() {
            if (!state.cameraActive || !state.camera) return;
            state.cameraActive = false;
            try {
                await state.camera.stop();
                state.camera.clear();
            } catch (_) {}
            elements.cameraPanel.classList.remove("active");
            elements.cameraButton.textContent = "📷 启用摄像头备用";
            await updateQueueCount();
            armHidCapture();
        }

        async function onCameraScan(decodedText) {
            const normalized = normalizeScanValue(decodedText);
            const now = Date.now();
            if (state.cameraBusy || (normalized === state.lastCameraValue && now - state.lastCameraAt < CAMERA_DEBOUNCE_MS)) return;
            state.cameraBusy = true;
            state.lastCameraValue = normalized;
            state.lastCameraAt = now;
            try {
                if (state.camera && state.cameraActive) state.camera.pause(true);
                await handleScan(decodedText, "camera");
            } finally {
                setTimeout(() => {
                    try { if (state.camera && state.cameraActive) state.camera.resume(); } catch (_) {}
                    state.cameraBusy = false;
                }, 650);
            }
        }

        async function bootstrap() {
            if (!state.legacyMode) {
                // 常驻终端只有出库扫码，隐藏占用首屏的模式选择。
                elements.tabAuto.parentElement.hidden = true;
            }

            elements.hidCapture.addEventListener("keydown", handleHidKeydown);
            elements.hidCapture.addEventListener("input", scheduleHidInput);
            document.addEventListener("keydown", captureHidKeyBeforeFocus, true);
            elements.hidCapture.addEventListener("beforeinput", event => {
                if (event.inputType !== "insertLineBreak") return;
                event.preventDefault();
                if (state.composing || event.isComposing) {
                    state.hidPendingTerminator = true;
                } else {
                    setTimeout(flushHidFrame, 0);
                }
            });
            elements.hidCapture.addEventListener("compositionstart", () => { state.composing = true; });
            elements.hidCapture.addEventListener("compositionend", () => {
                state.composing = false;
                scheduleHidInput();
                if (state.hidPendingTerminator) {
                    state.hidPendingTerminator = false;
                    setTimeout(flushHidFrame, 0);
                }
            });
            elements.hidCapture.addEventListener("blur", armHidCapture);

            elements.tabAuto.addEventListener("click", () => switchMode("AUTO"));
            if (state.legacyMode) {
                elements.tabMove.addEventListener("click", () => switchMode("MOVE"));
            }
            elements.cameraButton.addEventListener("click", async () => {
                try {
                    if (state.cameraActive) await stopCamera();
                    else await startCamera();
                } catch (error) { showError(error); }
            });
            elements.quantityInput.addEventListener("focus", resetHidFrame);
            elements.quantityConfirmButton.addEventListener("click", submitQuantityAdjustment);
            elements.pendingSelect.addEventListener("change", updatePendingDetail);
            elements.pendingBarcode.addEventListener("focus", resetHidFrame);
            elements.pendingQuantity.addEventListener("focus", resetHidFrame);
            elements.pendingBarcode.addEventListener("keydown", event => {
                if (event.key !== "Enter" && event.key !== "Tab") return;
                event.preventDefault();
                addPendingAllocation();
            });
            elements.pendingAddButton.addEventListener("click", addPendingAllocation);
            elements.pendingAllocations.addEventListener("focus", resetHidFrame);
            elements.pendingAllocations.addEventListener("input", renderPendingAllocationList);
            elements.pendingConfirmButton.addEventListener("click", submitPendingResolution);
            elements.retryButton.addEventListener("click", async () => {
                resetHidFrame();
                elements.hidPreview.textContent = "输入框已就绪";
                armHidCapture();
                if (!state.db) {
                    showError("本地待发送队列尚未就绪");
                    return;
                }
                const pending = await getPending();
                if (!pending.some(isCurrentQueueOwner)) {
                    showResult("当前没有待发送事件，请重新完整扫描", true);
                    return;
                }
                await processQueue();
            });
            elements.closeButton.addEventListener("click", () => tg.close());
            window.addEventListener("online", () => processQueue());
            window.addEventListener("focus", restoreHidCaptureAfterPageResume);
            document.addEventListener("pointerup", event => {
                if (event.target === elements.pendingSelect) return;
                armHidCapture();
            });
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) {
                    restoreHidCaptureAfterPageResume();
                    processQueue();
                }
            });

            if (state.legacyMode) {
                setConnection("error", "兼容单次模式");
                elements.sessionText.textContent = "请从机器人新的“扫码终端”菜单打开，才能连续扫码；当前入口仍可完成一次查询或移库。";
                elements.queueText.textContent = "当前扫码将通过 Telegram 原通道发送";
                armHidCapture();
                return;
            }

            try {
                state.db = await openDatabase();
                await updateQueueCount();
            } catch (error) {
                setConnection("error", "本地安全队列不可用");
                showError(error);
            }

            try {
                await exchangeWebSession();
                await loadServerSession();
                await processQueue();
            } catch (error) {
                setConnection("error", "扫码服务连接失败");
                showError(error);
            }
            armHidCapture();
        }

        bootstrap();
    </script>
</body>
</html>
