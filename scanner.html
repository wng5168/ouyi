<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI 仓储极速扫码</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: white; margin: 0; text-align: center; overflow: hidden; font-family: sans-serif; }
        #reader { width: 100%; height: 100vh; }

        /* 顶部模式切换选项卡 */
        .tabs { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(50,50,50,0.8); border-radius: 20px; z-index: 20; padding: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .tab-btn { background: transparent; color: #aaa; border: none; padding: 10px 20px; font-size: 15px; border-radius: 15px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #2196F3; color: white; }

        /* 蓝牙扫码枪通常以 HID 键盘模式工作，无需厂商插件。 */
        .input-status { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 30px); background: rgba(0,0,0,0.72); color: #d7ffd9; border: 1px solid rgba(0,230,118,0.7); border-radius: 16px; padding: 7px 14px; font-size: 13px; z-index: 20; }
        .input-status.camera-error { color: #ffe082; border-color: rgba(255,193,7,0.8); }

        /* 底部操作台 */
        .control-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(20, 20, 20, 0.95); padding: 25px 0 35px 0; z-index: 10; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        #info { font-size: 18px; font-weight: bold; margin-bottom: 20px; line-height: 1.5; }
        .highlight { color: #FFD700; font-size: 20px; }

        .btn-cancel { background: #444; color: white; border: 1px solid #666; padding: 12px 35px; font-size: 16px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .btn-cancel:active { background: #666; }
        .btn-submit { background: #00a65a; color: white; border: 0; padding: 12px 30px; font-size: 16px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-left: 8px; }
        .btn-undo { background: #795548; color: white; border: 0; padding: 10px 22px; font-size: 15px; border-radius: 24px; cursor: pointer; margin-right: 8px; }
        #batch-actions { display: none; margin: 15px 0 18px; }
        #hid-capture { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
        body.hid-mode #reader { display: none; }
        body.hid-mode .control-panel { top: 145px; bottom: auto; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        body.outbound-mode .tabs { display: none; }
    </style>
</head>
<body>
    <div class="tabs">
        <button id="tab-query" class="tab-btn active" onclick="switchMode('QUERY')">🔍 单次查询</button>
        <button id="tab-move" class="tab-btn" onclick="switchMode('MOVE')">📍 连续移库</button>
    </div>

    <div id="input-status" class="input-status">🔫 蓝牙扫码枪已就绪（HID），摄像头也可同时扫描</div>

    <div id="reader"></div>
    <input id="hid-capture" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" aria-label="蓝牙扫码枪输入" />

    <div class="control-panel">
        <div id="info">请扫描 <span style="color:#00e676;">【产品条码】</span></div>
        <div id="batch-actions">
            <button class="btn-undo" onclick="undoBatchScan()">↩️ 撤销上一条</button>
            <button class="btn-submit" onclick="submitOutboundBatch()">✅ 提交本批</button>
        </div>
        <button class="btn-cancel" onclick="tg.close()">❌ 取消并返回</button>
    </div>

    <script>
    window.addEventListener("DOMContentLoaded", function() {
        const inputMode = new URLSearchParams(window.location.search).get("input");
        if (inputMode === "hid") return;
        navigator.permissions.query({ name: "camera" }).then(function(result) {
            if (result.state === "granted") {
                // 已经有权限了，扫码时直接拉起，不再弹窗
                console.log("摄像头权限已就绪");
            } else {
                // 引导用户点击一次始终允许
                console.log("等待获取摄像头权限");
            }
        });
    });
    </script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const queryParams = new URLSearchParams(window.location.search);
        const isHidInput = queryParams.get("input") === "hid";
        const isOutboundFlow = (
            isHidInput && queryParams.get("flow") === "outbound"
        );
        const MAX_OUTBOUND_BATCH_SCANS = 200;

        // 核心状态管理
        let currentMode = 'QUERY';   // 模式：'QUERY' 或 'MOVE'
        let moveStep = 1;            // 移库模式下的步骤：1 或 2
        let scannedProduct = "";     // 暂存第一步扫到的产品码
        let cameraRunning = false;
        let acceptScanAfter = 0;
        let lastAcceptedCode = "";
        let lastAcceptedAt = 0;
        let html5QrCode = null;
        let outboundBatch = [];

        // HID 扫码枪会像键盘一样输入字符，通常以 Enter/Tab 结尾。
        // 蓝牙与 Android WebView 可能产生较大字符间隔，空闲提交不能过短。
        const HID_IDLE_COMMIT_MS = 450;
        const HID_MIN_CODE_LENGTH = 2;
        const HID_MAX_CAPTURE_LENGTH = 96;
        const DUPLICATE_GUARD_MS = 800;
        let hidBuffer = "";
        let hidCommitTimer = null;

        // --- 1. 生成提示音 (无需音频文件，纯代码发声) ---
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, ctx.currentTime); // 频率，清脆的滴声
                gain.gain.setValueAtTime(0.5, ctx.currentTime);     // 音量
                osc.start();
                osc.stop(ctx.currentTime + 0.1); // 持续 100 毫秒
            } catch(e) {}
        }

        // --- 2. 模式切换 UI 逻辑 ---
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-query').classList.remove('active');
            document.getElementById('tab-move').classList.remove('active');

            if (mode === 'QUERY') {
                document.getElementById('tab-query').classList.add('active');
                document.getElementById('info').innerHTML = `请扫描 <span style="color:#00e676;">【产品条码】</span> 查档案`;
            } else {
                document.getElementById('tab-move').classList.add('active');
                moveStep = 1;
                scannedProduct = "";
                document.getElementById('info').innerHTML = `第一步：扫描 <span style="color:#00e676;">【产品条码】</span>`;
            }
        }

        function normalizeFullWidthAscii(rawText) {
            return String(rawText || "").replace(
                /[！-～]/g,
                (character) => String.fromCharCode(character.charCodeAt(0) - 0xFEE0),
            ).replace(/　/g, " ");
        }

        function normalizeScanCode(rawText) {
            return normalizeFullWidthAscii(rawText)
                .replace(/[\u0000-\u001F\u007F]/g, "")
                .trim()
                .toUpperCase()
                .replace(/^(?:\]C1|\]E0|\]E4|\]Q[0-9])/, "");
        }

        function extractOutboundBarcode(rawText) {
            const normalized = normalizeScanCode(rawText);
            if (/^[0-9]{6,18}$/.test(normalized)) return normalized;

            // 部分 Android WebView 会把一次 HID 输入完整重复一次。
            if (/^[0-9]+$/.test(normalized) && normalized.length % 2 === 0) {
                const middle = normalized.length / 2;
                const firstHalf = normalized.slice(0, middle);
                if (
                    firstHalf === normalized.slice(middle)
                    && /^[0-9]{6,18}$/.test(firstHalf)
                ) {
                    return firstHalf;
                }
            }

            // 支持扫码枪附加厂商前后缀，但歧义时拒绝猜测。
            const candidates = [...normalized.matchAll(
                /(?:^|[^0-9])([0-9]{6,18})(?=$|[^0-9])/g,
            )].map((match) => match[1]);
            const uniqueCandidates = [...new Set(candidates)];
            return uniqueCandidates.length === 1 ? uniqueCandidates[0] : "";
        }

        function updateInputStatus(source, cameraError = false) {
            const status = document.getElementById("input-status");
            status.classList.toggle("camera-error", cameraError);
            if (cameraError) {
                status.innerText = "🔫 摄像头不可用，蓝牙扫码枪仍可直接扫描";
            } else if (source === "HID") {
                status.innerText = "🔫 已接收蓝牙扫码枪数据";
            } else {
                status.innerText = "📷 已接收摄像头扫码数据";
            }
        }

        function focusHidCapture() {
            if (!isHidInput) return;
            const capture = document.getElementById("hid-capture");
            capture.focus({ preventScroll: true });
        }

        function renderHidRecognitionError(rawText) {
            const normalized = normalizeScanCode(rawText);
            const preview = normalized.slice(0, 32) || "空";
            document.getElementById("input-status").innerText =
                "⚠️ 已读取数据，但不是有效商品条码";
            document.getElementById("info").innerText =
                `读取 ${normalized.length} 字符：[${preview}]，请重新扫描`;
            focusHidCapture();
        }

        function renderOutboundBatch(lastCode = "") {
            const distinctCount = new Set(outboundBatch).size;
            const lastLine = lastCode ? `<br>最后：${lastCode}` : "";
            document.getElementById("info").innerHTML = (
                `已扫 <span class="highlight">${outboundBatch.length}</span> 次 / `
                + `${distinctCount} 款${lastLine}`
            );
        }

        function undoBatchScan() {
            if (outboundBatch.length) outboundBatch.pop();
            renderOutboundBatch(outboundBatch[outboundBatch.length - 1] || "");
            focusHidCapture();
        }

        function submitOutboundBatch() {
            if (!outboundBatch.length) {
                document.getElementById("info").innerText = "请先扫描商品条码";
                focusHidCapture();
                return;
            }
            sendTelegramPayload(`OUTBOUND_BATCH|${outboundBatch.join(",")}`);
        }

        function sendTelegramPayload(payload) {
            const sendAndClose = () => {
                tg.sendData(payload);
                tg.close();
            };
            if (!cameraRunning) {
                sendAndClose();
                return;
            }
            html5QrCode.stop().catch(() => {}).finally(() => {
                cameraRunning = false;
                sendAndClose();
            });
        }

        function pauseCameraBriefly() {
            if (!cameraRunning) return;
            try {
                html5QrCode.pause();
                setTimeout(() => {
                    try { html5QrCode.resume(); } catch (_) {}
                }, 1000);
            } catch (_) {}
        }

        // --- 3. 摄像头与蓝牙扫码枪共用的扫码成功回调 ---
        function submitScan(rawText, source = "CAMERA") {
            const decodedText = (
                isOutboundFlow && source === "HID"
                    ? extractOutboundBarcode(rawText)
                    : normalizeScanCode(rawText)
            );
            if (!decodedText && isOutboundFlow && source === "HID") {
                renderHidRecognitionError(rawText);
                return;
            }
            if (!decodedText || Date.now() < acceptScanAfter) return;

            const now = Date.now();
            if (isOutboundFlow && source === "HID") {
                if (outboundBatch.length >= MAX_OUTBOUND_BATCH_SCANS) {
                    document.getElementById("info").innerText =
                        "本批已达 200 次，请先提交";
                    return;
                }
                outboundBatch.push(decodedText);
                playBeep();
                updateInputStatus(source);
                renderOutboundBatch(decodedText);
                focusHidCapture();
                return;
            }
            if (
                decodedText === lastAcceptedCode
                && now - lastAcceptedAt < DUPLICATE_GUARD_MS
            ) {
                return;
            }
            lastAcceptedCode = decodedText;
            lastAcceptedAt = now;
            updateInputStatus(source);

            // 模式A：单次查询 (主流程)
            if (currentMode === 'QUERY') {
                playBeep();
                document.getElementById("info").innerText = "识别成功，正在查询...";
                sendTelegramPayload(decodedText);
                return;
            }

            // 模式B：连续移库流程
            if (currentMode === 'MOVE') {
                if (moveStep === 1) {
                    playBeep();
                    scannedProduct = decodedText;
                    moveStep = 2;
                    acceptScanAfter = now + 800;
                    document.getElementById("info").innerHTML = `已锁定产品: <span class="highlight">${scannedProduct}</span><br>第二步：请扫描 <span style="color:#2196F3;">【新库位码】</span>`;
                    pauseCameraBriefly();
                }
                else if (moveStep === 2) {
                    // 🚨 核心防抖：如果扫到的码跟刚才产品码一模一样，直接忽略，不发声！
                    if (decodedText === scannedProduct) {
                        return;
                    }

                    // 扫到了不同的码，判定为库位码
                    playBeep();
                    document.getElementById("info").innerText = "数据打包中，请稍候...";
                    let payload = `MOVE_LOC|${scannedProduct}|${decodedText}`;
                    sendTelegramPayload(payload);
                }
            }
        }

        const onScanSuccess = (decodedText) => submitScan(decodedText, "CAMERA");
        const hidCapture = document.getElementById("hid-capture");

        function scheduleHidCommit() {
            if (hidCommitTimer) clearTimeout(hidCommitTimer);
            hidCommitTimer = setTimeout(commitHidBuffer, HID_IDLE_COMMIT_MS);
        }

        function commitHidBuffer() {
            if (hidCommitTimer) {
                clearTimeout(hidCommitTimer);
                hidCommitTimer = null;
            }
            const code = isHidInput ? (hidCapture.value || hidBuffer) : hidBuffer;
            hidBuffer = "";
            if (isHidInput) hidCapture.value = "";
            if (code.length >= HID_MIN_CODE_LENGTH) {
                submitScan(code, "HID");
            }
        }

        function keyEventCharacter(event) {
            if (event.key && event.key.length === 1) return event.key;
            const code = String(event.code || "");
            if (/^Digit[0-9]$/.test(code)) return code.slice(-1);
            if (/^Numpad[0-9]$/.test(code)) return code.slice(-1);
            if (/^Key[A-Z]$/.test(code)) return code.slice(-1);
            return code === "Minus" || code === "NumpadSubtract" ? "-" : "";
        }

        document.addEventListener("keydown", (event) => {
            if (event.ctrlKey || event.altKey || event.metaKey) return;

            const isTerminator = (
                event.key === "Enter"
                || event.key === "Tab"
                || event.code === "Enter"
                || event.code === "NumpadEnter"
                || event.code === "Tab"
            );
            if (isTerminator) {
                if (isHidInput && hidCapture.value) {
                    hidBuffer = hidCapture.value;
                }
                if (hidBuffer) {
                    event.preventDefault();
                    commitHidBuffer();
                }
                return;
            }
            if (event.key === "Escape") {
                hidBuffer = "";
                if (isHidInput) hidCapture.value = "";
                if (hidCommitTimer) clearTimeout(hidCommitTimer);
                hidCommitTimer = null;
                return;
            }
            const character = keyEventCharacter(event);
            if (!character || character.charCodeAt(0) > 127) return;

            if (isHidInput) {
                // 以 input 事件为主；仅在 WebView 未产生 input 时补录 keydown，避免双写。
                const valueBeforeDefault = hidCapture.value;
                setTimeout(() => {
                    if (hidCapture.value !== valueBeforeDefault) return;
                    hidCapture.value += character;
                    hidBuffer = hidCapture.value;
                    scheduleHidCommit();
                }, 0);
                return;
            }
            hidBuffer += character;
            scheduleHidCommit();
        });

        hidCapture.addEventListener("input", (event) => {
            const capturedText = String(event.target.value || "");
            if (capturedText.length > HID_MAX_CAPTURE_LENGTH) {
                event.target.value = "";
                hidBuffer = "";
                renderHidRecognitionError(capturedText);
                return;
            }
            hidBuffer = capturedText;
            if (hidBuffer) scheduleHidCommit();
        });

        // --- 4. 启动扫描引擎 ---
        const config = { fps: 20, qrbox: { width: 280, height: 200 }, aspectRatio: 1.0 };

        async function startScanner() {
            try {
                html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, () => {});
                cameraRunning = true;
            } catch (err) {
                updateInputStatus("HID", true);
                document.getElementById("info").innerText = "摄像头启动失败；蓝牙扫码枪仍可直接扫描";
            }
        }

        if (isHidInput) {
            document.body.classList.add("hid-mode");
            document.getElementById("input-status").innerText =
                "🔫 蓝牙扫码枪已就绪（无需摄像头）";
            document.getElementById("info").innerHTML =
                "请直接扫描 <span style=\"color:#00e676;\">【条码或库位码】</span>";
            if (isOutboundFlow) {
                document.body.classList.add("outbound-mode");
                document.getElementById("batch-actions").style.display = "block";
                document.getElementById("info").innerHTML =
                    "请连续扫描 <span style=\"color:#00e676;\">【产品条码】</span>";
            }
            document.addEventListener("pointerdown", focusHidCapture);
            window.addEventListener("focus", focusHidCapture);
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) focusHidCapture();
            });
            setTimeout(focusHidCapture, 50);
        } else {
            startScanner();
        }
    </script>
</body>
</html>
